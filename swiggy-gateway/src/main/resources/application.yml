spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
           - id: swiggy-app
             uri: lb://SWIGGY-APP
             predicates:
               - Path=/swiggy/**
             filters:
               - AuthenticationFilter

           - id: restaurant-service
             uri: lb://RESTAURANT-SERVICE
             predicates:
               - Path=/restaurant/**
             filters:
               - AuthenticationFilter

           - id: identity-service
             uri: lb://IDENTITY-SERVICE
             predicates:
               - Path=/auth/**

          discovery:
            locator:
              enabled: true   # allows dynamic routing via Eureka
              lower-case-service-id: true

  application:
    name: SWIGGY-GATEWAY

eureka:
  client:
    service-url:
      defaultZone : http://localhost:8761/eureka/